<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 215" width="495" height="215" style="--bg:var(--cw-bg);--fg:var(--cw-fg);--line:var(--cw-line);--accent:var(--cw-accent);--muted:var(--cw-muted);--surface:var(--cw-surface);--border:var(--cw-border)"><style>svg{--cw-bg:#ffffff;--cw-fg:#29261b;--cw-line:#a8a29e;--cw-accent:#2563eb;--cw-muted:#6f6a64;--cw-surface:#f1f5fe;--cw-border:#9db8ef;--cw-s0:#2563eb;--cw-s1:#0f8a7e;--cw-s2:#c2410c;--cw-s3:#7c3aed;--cw-s4:#be185d;--cw-s5:#4d7c0f}@media (prefers-color-scheme: dark){svg{--cw-bg:#262624;--cw-fg:#ece9e3;--cw-line:#77726b;--cw-accent:#7aa7ff;--cw-muted:#aaa59e;--cw-surface:#28324a;--cw-border:#5677c2;--cw-s0:#7aa7ff;--cw-s1:#5fd0c4;--cw-s2:#f5a25d;--cw-s3:#b49cff;--cw-s4:#f38bb8;--cw-s5:#a5d16b}}text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif}.mono,text.mono{font-family:ui-monospace,'Cascadia Mono',Consolas,monospace}</style>
<style>
  
  text { font-family: 'system-ui', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
